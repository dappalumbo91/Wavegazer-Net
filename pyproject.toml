[project]
name = "wavegazer"
version = "0.1.0"
description = "Wavegazer Net: FSOT visual equivalent of U-Net. Frozen canonical U-Net baseline plus a zero-trainable-parameter seed-spine network."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Damian Arthur Palumbo" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
